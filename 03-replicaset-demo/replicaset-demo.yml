apiVersion: apps/v1
kind: ReplicaSet
metadata:
  name: grafana-rs-demo
  labels:
    app: grafana-rs-demo
spec:
  replicas: 6
  selector:
    matchLabels:
      app: grafana-rs-demo
  template:
    metadata:
      labels:
        app: grafana-rs-demo
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:10.4.2
          ports:
            - containerPort: 3000
